name: "Build namida package and deps"

on:
  push:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        packages: [
          "beta",
          "beta-cutsie",
          "beta-eddy",
          "beta-enhanced",
          "beta-glowy",
          "beta-hollow",
          "beta-jellyda",
          "beta-kyunda",
          "beta-namichin",
          "beta-namiween",
          "beta-ookami",
          "beta-original",
          "beta-pastel",
          "beta-retro",
          "beta-shade",
          "beta-space",
          "beta-spooky",
          "beta-tetoda",
          "beta-tired",
          "default",
          "default-cutsie",
          "default-eddy",
          "default-enhanced",
          "default-glowy",
          "default-hollow",
          "default-jellyda",
          "default-kyunda",
          "default-namichin",
          "default-namiween",
          "default-ookami",
          "default-original",
          "default-pastel",
          "default-retro",
          "default-shade",
          "default-space",
          "default-spooky",
          "default-tetoda",
          "default-tired",
        ]

    environment:
      name: namida

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: namida-nix
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: false
          useDaemon: true
          pathsToPush: ""

      - name: Check if auth token is present
        run: |
          if [ -n "${{ secrets.CACHIX_AUTH_TOKEN }}" ]; then
            echo "Secret is present and loaded!"
          else
            echo "Secret is empty or missing!"
            exit 1
          fi

      - run: nix build --accept-flake-config .#${{ matrix.packages }}
